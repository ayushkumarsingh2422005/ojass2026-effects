<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>

    <style>
        .cardwrapper {
            position: relative;
            width: 400px;
            height: 400px;
            scale: .97;
            margin: 3vmin .8vmax;
            cursor: pointer;
        }

        .card-border {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background-color: #d2d2d2;
            transition-duration: .1s;
            -webkit-clip-path: path("M1 15.5V312C1 316.5 2.8 320.8 6 324L38 356C41.2 359.2 45.5 361 50 361H178C182.3 361 186.5 362.6 189.7 365.5L207 381C210.2 383.9 214.4 385.5 218.7 385.5H378C387.4 385.5 395 377.9 395 368.5V76C395 66.6 387.4 59 378 59H309C304.3 59 299.9 57.1 296.6 53.8L257.5 14C254.2 10.7 249.8 8.8 245.1 8.8H21C11.6 8.8 4 16.4 4 15.5Z");
            clip-path: path("M1 15.5V312C1 316.5 2.8 320.8 6 324L38 356C41.2 359.2 45.5 361 50 361H178C182.3 361 186.5 362.6 189.7 365.5L207 381C210.2 383.9 214.4 385.5 218.7 385.5H378C387.4 385.5 395 377.9 395 368.5V76C395 66.6 387.4 59 378 59H309C304.3 59 299.9 57.1 296.6 53.8L257.5 14C254.2 10.7 249.8 8.8 245.1 8.8H21C11.6 8.8 4 16.4 4 15.5Z");
            z-index: -1;
            scale: 1.007;
        }

        .card {
            width: 400px;
            height: 400px;
            /* -webkit-clip-path: path("M1 15.5V312C1 316.5 2.8 320.8 6 324L38 356C41.2 359.2 45.5 361 50 361H178C182.3 361 186.5 362.6 189.7 365.5L207 381C210.2 383.9 214.4 385.5 218.7 385.5H378C387.4 385.5 395 377.9 395 368.5V76C395 66.6 387.4 59 378 59H309C304.3 59 299.9 57.1 296.6 53.8L257.5 14C254.2 10.7 249.8 8.8 245.1 8.8H21C11.6 8.8 4 16.4 4 15.5Z"); */
            clip-path: path("M1 15.5V312C1 316.5 2.8 320.8 6 324L38 356C41.2 359.2 45.5 361 50 361H178C182.3 361 186.5 362.6 189.7 365.5L207 381C210.2 383.9 214.4 385.5 218.7 385.5H378C387.4 385.5 395 377.9 395 368.5V76C395 66.6 387.4 59 378 59H309C304.3 59 299.9 57.1 296.6 53.8L257.5 14C254.2 10.7 249.8 8.8 245.1 8.8H21C11.6 8.8 4 16.4 4 15.5Z");
            position: relative;
        }

        .card:after {
            content: "";
            position: absolute;
            top: 0;
            right: 0;
            bottom: 0;
            left: 0;
            transition-duration: .3s;
            background: linear-gradient(to top, black, black, transparent, transparent, transparent), url(./assets/bg.jpg);
        }

        .hover1 {
            position: absolute;
            z-index: -2;
            width: 130px;
            height: 70px;
            transform: translate(100px, 100px);
            left: 0;
            top: 0;
            border-radius: 10px;
            transition-duration: .3s;
            opacity: 0;
            background-color: #000;
        }

        .hover2 {
            position: absolute;
            width: 245px;
            height: 70px;
            right: 0;
            bottom: 0;
            border-radius: 10px;
            transform: translate(0px, -100px);
            z-index: -2;
            transition-duration: .3s;
            opacity: 0;
            background-color: #000000;
        }

        .cardwrapper:hover>.hover1 {
            transform: translate(130px, 20px);
            opacity: 1;
            background-color: #000000;
        }

        .cardwrapper:hover>.hover2 {
            transform: translate(-150px, -21px);
            opacity: 1;
        }

        .team-card-portrait {
            width: 100%;
            height: 100%;
            object-fit: cover;
            position: absolute;
            top: 0;
            left: 0;
        }

        /* Team card content - visible by default */
        .team-card-content {
            position: absolute;
            bottom: 40px;
            right: 20px;
            z-index: 10;
            color: white;
            text-align: right;
        }

        .team-card-content h2 {
            margin: 0 0 5px 0;
            font-size: 24px;
            font-weight: 700;
            text-shadow: 2px 2px 4px rgba(0, 0, 0, 0.8);
        }

        .team-card-content p {
            margin: 0;
            font-size: 14px;
            opacity: 0.9;
            text-shadow: 1px 1px 3px rgba(0, 0, 0, 0.8);
        }

        /* Social links - visible on left side */
        .social-links {
            position: absolute;
            bottom: 45px;
            left: 35px;
            display: flex;
            flex-direction: row;
            gap: 15px;
            z-index: 10;
        }

        .social-links a {
            width: 45px;
            height: 45px;
            background: rgba(255, 255, 255, 0.1);
            backdrop-filter: blur(10px);
            border: 2px solid rgba(255, 255, 255, 0.3);
            border-radius: 50%;
            display: flex;
            justify-content: center;
            align-items: center;
            color: white;
            text-decoration: none;
            font-size: 18px;
            transition: all 0.3s ease;
        }

        .social-links a:hover {
            background: rgba(255, 255, 255, 0.25);
            border-color: rgba(255, 255, 255, 0.6);
            transform: scale(1.1);
        }
    </style>
</head>

<body>
    <div class="cardwrapper teamwrapper">
        <div class="hover1"></div>
        <div class="hover2"></div>
        <div class="card-border red teamborder"></div>
        <section class="card red team-card" style="background-color: #7c1414;">
            <img class="team-card-portrait" src="https://toppng.com/uploads/preview/team-png-115540073766xajcucu7e.png"
                alt="photo">

            <!-- Default content - visible normally -->
            <div class="team-card-content">
                <h2>John Doe</h2>
                <p>Web Developer</p>
            </div>

            <!-- Social links - LinkedIn & GitHub -->
            <div class="social-links">
                <a href="https://linkedin.com/in/johndoe" target="_blank" aria-label="LinkedIn">
                    <svg width="20" height="20" viewBox="0 0 24 24" fill="currentColor">
                        <path
                            d="M19 3a2 2 0 0 1 2 2v14a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h14m-.5 15.5v-5.3a3.26 3.26 0 0 0-3.26-3.26c-.85 0-1.84.52-2.32 1.3v-1.11h-2.79v8.37h2.79v-4.93c0-.77.62-1.4 1.39-1.4a1.4 1.4 0 0 1 1.4 1.4v4.93h2.79M6.88 8.56a1.68 1.68 0 0 0 1.68-1.68c0-.93-.75-1.69-1.68-1.69a1.69 1.69 0 0 0-1.69 1.69c0 .93.76 1.68 1.69 1.68m1.39 9.94v-8.37H5.5v8.37h2.77z" />
                    </svg>
                </a>
                <a href="https://github.com/johndoe" target="_blank" aria-label="GitHub">
                    <svg width="20" height="20" viewBox="0 0 24 24" fill="currentColor">
                        <path
                            d="M12 2A10 10 0 0 0 2 12c0 4.42 2.87 8.17 6.84 9.5.5.08.66-.23.66-.5v-1.69c-2.77.6-3.36-1.34-3.36-1.34-.46-1.16-1.11-1.47-1.11-1.47-.91-.62.07-.6.07-.6 1 .07 1.53 1.03 1.53 1.03.87 1.52 2.34 1.07 2.91.83.09-.65.35-1.09.63-1.34-2.22-.25-4.55-1.11-4.55-4.92 0-1.11.38-2 1.03-2.71-.1-.25-.45-1.29.1-2.64 0 0 .84-.27 2.75 1.02.79-.22 1.65-.33 2.5-.33.85 0 1.71.11 2.5.33 1.91-1.29 2.75-1.02 2.75-1.02.55 1.35.2 2.39.1 2.64.65.71 1.03 1.6 1.03 2.71 0 3.82-2.34 4.66-4.57 4.91.36.31.69.92.69 1.85V21c0 .27.16.59.67.5C19.14 20.16 22 16.42 22 12A10 10 0 0 0 12 2z" />
                    </svg>
                </a>
            </div>
        </section>
    </div>
</body>

</html>
