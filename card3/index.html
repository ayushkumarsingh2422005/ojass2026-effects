<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>

    <style>
        .cardwrapper {
            position: relative;
            width: 313px;
            height: 462px;
            scale: .97;
            margin: 3vmin .8vmax;
            cursor: pointer;
        }

        .card-border {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background-color: #d2d2d2;
            transition-duration: .1s;
            -webkit-clip-path: path("M1 18.3657V380.245C1 384.802 2.79117 389.176 5.98718 392.424L45.8532 432.814C49.1176 436.131 53.5772 438 58.2316 438H217.365C221.672 438 225.826 439.601 229.019 442.491L250.571 461.999C253.764 464.889 257.918 466.49 262.225 466.49H290.247C299.838 466.49 307.612 458.715 307.612 449.124V92.4971C307.612 82.9063 299.838 75.1314 290.247 75.1314H234.691C230.037 75.1314 225.577 73.2626 222.313 69.9449L178.574 25.3145C175.31 21.9968 170.15 20.128 166.096 20.128H18.3657C8.77487 20.128 1 12.3531 1 18.3657Z");
            clip-path: path("M1 18.3657V380.245C1 384.802 2.79117 389.176 5.98718 392.424L45.8532 432.814C49.1176 436.131 53.5772 438 58.2316 438H217.365C221.672 438 225.826 439.601 229.019 442.491L250.571 461.999C253.764 464.889 257.918 466.49 262.225 466.49H290.247C299.838 466.49 307.612 458.715 307.612 449.124V92.4971C307.612 82.9063 299.838 75.1314 290.247 75.1314H234.691C230.037 75.1314 225.577 73.2626 222.313 69.9449L178.574 25.3145C175.31 21.9968 170.15 20.128 166.096 20.128H18.3657C8.77487 20.128 1 12.3531 1 18.3657Z");
            z-index: -1;
            scale: 1.007;
        }

        .card {
            width: 313px;
            height: 462px;
            /* -webkit-clip-path: path("M1 18.3657V380.245C1 384.802 2.79117 389.176 5.98718 392.424L45.8532 432.814C49.1176 436.131 53.5772 438 58.2316 438H217.365C221.672 438 225.826 439.601 229.019 442.491L250.571 461.999C253.764 464.889 257.918 466.49 262.225 466.49H290.247C299.838 466.49 307.612 458.715 307.612 449.124V92.4971C307.612 82.9063 299.838 75.1314 290.247 75.1314H234.691C230.037 75.1314 225.577 73.2626 222.313 69.9449L178.574 25.3145C175.31 21.9968 170.15 20.128 166.096 20.128H18.3657C8.77487 20.128 1 12.3531 1 18.3657Z"); */
            clip-path: path("M1 18.3657V380.245C1 384.802 2.79117 389.176 5.98718 392.424L45.8532 432.814C49.1176 436.131 53.5772 438 58.2316 438H217.365C221.672 438 225.826 439.601 229.019 442.491L250.571 461.999C253.764 464.889 257.918 466.49 262.225 466.49H290.247C299.838 466.49 307.612 458.715 307.612 449.124V92.4971C307.612 82.9063 299.838 75.1314 290.247 75.1314H234.691C230.037 75.1314 225.577 73.2626 222.313 69.9449L178.574 25.3145C175.31 21.9968 170.15 20.128 166.096 20.128H18.3657C8.77487 20.128 1 12.3531 1 18.3657Z");
            position: relative;
        }

        .card:after {
            content: "";
            position: absolute;
            top: 0;
            right: 0;
            bottom: 0;
            left: 0;
            transition-duration: .3s;
            background: linear-gradient(to top, black, black, transparent, transparent, transparent), url(./assets/bg.jpg);
        }

        .hover1 {
            position: absolute;
            z-index: -2;
            width: 150px;
            height: 80px;
            transform: translate(100px, 100px);
            left: 0;
            top: 0;
            border-radius: 10px;
            transition-duration: .3s;
            opacity: 0;
            background-color: #000;
        }

        .hover2 {
            position: absolute;
            width: 285px;
            height: 80px;
            right: 0;
            bottom: 0;
            border-radius: 10px;
            transform: translate(0px, -100px);
            z-index: -2;
            transition-duration: .3s;
            opacity: 0;
            background-color: #000000;
        }

        .cardwrapper:hover>.hover1 {
            transform: translate(150px, 25px);
            opacity: 1;
            background-color: #000000;
        }

        .cardwrapper:hover>.hover2 {
            transform: translate(-20px, -5px);
            opacity: 1;
        }

        .team-card-portrait {
            width: 100%;
            height: 100%;
            object-fit: cover;
            position: absolute;
            top: 0;
            left: 0;
        }

        /* Team card content - visible by default */
        .team-card-content {
            position: absolute;
            bottom: 40px;
            right: 20px;
            z-index: 10;
            color: white;
            text-align: right;
        }

        .team-card-content h2 {
            margin: 0 0 5px 0;
            font-size: 24px;
            font-weight: 700;
            text-shadow: 2px 2px 4px rgba(0, 0, 0, 0.8);
        }

        .team-card-content p {
            margin: 0;
            font-size: 14px;
            opacity: 0.9;
            text-shadow: 1px 1px 3px rgba(0, 0, 0, 0.8);
        }

        /* Contact links - visible on left side */
        .social-links {
            position: absolute;
            bottom: 40px;
            left: 35px;
            display: flex;
            flex-direction: row;
            gap: 15px;
            z-index: 10;
        }

        .social-links a {
            width: 45px;
            height: 45px;
            background: rgba(255, 255, 255, 0.1);
            backdrop-filter: blur(10px);
            border: 2px solid rgba(255, 255, 255, 0.3);
            border-radius: 50%;
            display: flex;
            justify-content: center;
            align-items: center;
            color: white;
            text-decoration: none;
            font-size: 18px;
            transition: all 0.3s ease;
        }

        .social-links a:hover {
            background: rgba(255, 255, 255, 0.25);
            border-color: rgba(255, 255, 255, 0.6);
            transform: scale(1.1);
        }
    </style>
</head>

<body>
    <div class="cardwrapper teamwrapper">
        <div class="hover1"></div>
        <div class="hover2"></div>
        <div class="card-border red teamborder"></div>
        <section class="card red team-card" style="background-color: #7c1414;">
            <img class="team-card-portrait" src="https://toppng.com/uploads/preview/team-png-115540073766xajcucu7e.png"
                alt="photo">

            <!-- Default content - visible normally -->
            <div class="team-card-content">
                <h2>John Doe</h2>
                <p>Web Developer</p>
            </div>

            <!-- Contact info - visible on hover -->
            <div class="social-links">
                <a href="tel:+1234567890" aria-label="Phone">
                    <svg width="20" height="20" viewBox="0 0 24 24" fill="currentColor">
                        <path
                            d="M20.01 15.38c-1.23 0-2.42-.2-3.53-.56-.35-.12-.74-.03-1.01.24l-1.57 1.97c-2.83-1.35-5.48-3.9-6.89-6.83l1.95-1.66c.27-.28.35-.67.24-1.02-.37-1.11-.56-2.3-.56-3.53 0-.54-.45-.99-.99-.99H4.19C3.65 3 3 3.24 3 3.99 3 13.28 10.73 21 20.01 21c.71 0 .99-.63.99-1.18v-3.45c0-.54-.45-.99-.99-.99z" />
                    </svg>
                </a>
                <a href="mailto:johndoe@example.com" aria-label="Email">
                    <svg width="20" height="20" viewBox="0 0 24 24" fill="currentColor">
                        <path
                            d="M20 4H4c-1.1 0-1.99.9-1.99 2L2 18c0 1.1.9 2 2 2h16c1.1 0 2-.9 2-2V6c0-1.1-.9-2-2-2zm0 4l-8 5-8-5V6l8 5 8-5v2z" />
                    </svg>
                </a>
            </div>
        </section>
    </div>

</html>
